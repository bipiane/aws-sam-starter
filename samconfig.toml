# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default]
[default.deploy]
[default.deploy.parameters]
stack_name = "aws-sam-starter"
resolve_s3 = true
s3_prefix = "aws-sam-starter"
region = "us-east-1"
confirm_changeset = false
capabilities = ["CAPABILITY_NAMED_IAM"]
disable_rollback = false
image_repositories = []
parameter_overrides = [
    "Environment=testing",
]
tags = [
    "Environment=testing",
    "Project=aws-sam-starter"
]

[testing]
[testing.deploy]
[testing.deploy.parameters]
stack_name = "aws-sam-starter"
resolve_s3 = true
s3_prefix = "aws-sam-starter"
region = "us-east-1"
confirm_changeset = false
capabilities = ["CAPABILITY_NAMED_IAM"]
disable_rollback = false
image_repositories = []
parameter_overrides = [
    "Environment=testing",
]
tags = [
    "Environment=testing",
    "Project=aws-sam-starter",
]

[production]
[production.deploy]
[production.deploy.parameters]
stack_name = "aws-sam-starter"
resolve_s3 = true
s3_prefix = "aws-sam-starter"
region = "us-east-2"
confirm_changeset = false
capabilities = ["CAPABILITY_NAMED_IAM"]
disable_rollback = false
image_repositories = []
parameter_overrides = [
    "Environment=testing",
]
tags = [
    "Environment=production",
    "Project=aws-sam-starter",
]